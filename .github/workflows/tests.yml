name: Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker compose
        run: docker-compose up -d
      - name: Run tests
        run: make test

      - name: Stop App
        if: always()
        run: docker-compose down -v
