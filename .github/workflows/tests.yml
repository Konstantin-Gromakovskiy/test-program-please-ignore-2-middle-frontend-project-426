name: Tests
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: computer_store
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      DATABASE_URL: postgresql://user:password@database:5432/computer_store
      PORT: 3000
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker compose
        run: docker compose up --build -d

      - name: Wait for App to start
        run: npx wait-on --timeout 60000 --interval 1000 --verbose http://localhost:3000/api/health-check

      - name: Install front
        run: make front-install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests
        run: make test

      - name: Show backend logs
        if: failure()
        run: docker compose logs backend

      - name: Stop App
        if: always()
        run: docker compose down -v
