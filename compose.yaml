services:
  database:
    image: postgres:18
    container_name: database
    restart: unless-stopped
    ports:
      - 5432:5432
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - computer-store-db:/var/lib/postgresql

volumes:
  computer-store-db:
